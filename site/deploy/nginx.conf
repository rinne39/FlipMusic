# nginx site for player.pjsk.store (Flip Music page + update server).
# Installed as /etc/nginx/sites-available/player-pjsk (linked from sites-enabled).
#
# This server terminates TLS behind its own `stream` block (nightcord-stream.conf): port 443 is
# forwarded with proxy_protocol to 127.0.0.1:4443, so HTTPS sites listen there, like the others.
# Certificate: its own lineage "player-pjsk", issued with webroot /var/www/ignis (shared ACME dir):
#   /opt/nightcord-certbot/bin/certbot certonly --webroot -w /var/www/ignis -d player.pjsk.store \
#     --cert-name player-pjsk --deploy-hook "systemctl reload nginx"
# and renewed by the existing nightcord-cert-renew.timer.
server {
    listen 80;
    listen [::]:80;
    server_name player.pjsk.store;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ignis; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name player.pjsk.store;
    ssl_certificate /etc/letsencrypt/live/player-pjsk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/player-pjsk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/player.pjsk.store;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The update manifest must never be cached, or phones keep seeing an old version.
    location = /update.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # APKs: the right type so phones offer to install them. Versioned files never change.
    location = /download/latest.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition 'attachment; filename="FlipMusic.apk"' always;
    }
    location /download/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
